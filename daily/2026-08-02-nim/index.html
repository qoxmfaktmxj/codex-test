<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>님</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header><p class="eyebrow">오늘의 고전 게임 · 돌 더미 전략</p><h1>님</h1><p>한 더미에서 돌을 하나 이상 가져가 마지막 돌을 차지하세요.</p></header>
    <section class="rule" aria-label="게임 규칙"><strong>규칙</strong><span>차례마다 한 더미만 고르고, 원하는 만큼의 돌을 가져갑니다.</span></section>
    <div class="piles" data-piles aria-label="돌 더미"></div>
    <p class="message" data-message aria-live="polite"></p>
    <p class="hint">돌을 누르면 그 더미에서 가져갈 돌 수를 고를 수 있습니다.</p>
    <button type="button" data-reset>새 게임</button>
  </main>
  <script src="game-logic.js"></script><script src="app.js"></script>
</body>
</html>
