<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 · 활자 인쇄소</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="edition">제 2048호 · 수동 조판실</p><h1>활자 <em>인쇄소</em></h1><p class="deck">같은 숫자 활자를 밀어 한 장의 2048호를 찍으세요.</p></header><section class="workbench" aria-label="2048 게임"><div class="scoreline"><span>현재 인쇄량 <b id="score">0</b></span><span id="status" aria-live="polite">활자를 밀어 조판을 시작하세요</span></div><div id="board" class="board" role="grid" aria-label="2048 게임판"></div><div class="controls"><button id="restart" type="button">새로 조판</button><p>방향키 또는 화면을 밀어 이동</p></div></section><aside><strong>조판 규칙</strong><span>같은 활자 둘이 만나면 하나의 큰 활자가 됩니다.</span></aside></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
