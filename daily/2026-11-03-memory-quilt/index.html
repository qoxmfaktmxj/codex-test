<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>페어 기억 놀이 · 다락방 퀼트</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">다락방 바느질 상자 · 한 쌍씩 찾기</p><h1>페어 기억 놀이</h1><p class="intro">같은 무늬의 천 조각 두 장을 찾아, 낡은 이불을 완성하세요.</p></header><section class="quilt-wrap" aria-label="페어 기억 놀이 게임판"><aside class="stitch-note"><b>맞춘 조각</b><strong id="found">0 / 8</strong><span>두 번 뒤집으면 한 차례입니다.</span></aside><div id="board" class="board" role="group" aria-label="퀼트 천 조각"></div><aside class="tools"><p id="status" aria-live="polite">천 조각을 두 장 뒤집어 보세요.</p><p class="count">차례 <b id="turns">0</b></p><button id="reset" type="button">새 이불 펴기</button></aside></section><p class="hint">마우스·터치 또는 Tab과 Enter로 조각을 고를 수 있습니다.</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
