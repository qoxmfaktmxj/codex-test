<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>갭 솔리테어</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 카드 퍼즐</p>
      <h1>갭 솔리테어</h1>
      <p class="intro">같은 무늬의 카드를 2부터 K까지 차례대로 이어, 네 줄의 빈칸을 끝까지 정리하세요.</p>
    </header>

    <section class="status-card" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite">카드를 고른 뒤, 이어질 수 있는 빈칸을 선택하세요.</p>
      <button id="reset" type="button">새로 시작</button>
    </section>

    <section class="board-wrap" aria-label="갭 솔리테어 말판">
      <div class="suit-legend" aria-label="줄 안내">
        <span>♣ 클로버</span><span>♦ 다이아</span><span>♥ 하트</span><span>♠ 스페이드</span>
      </div>
      <div id="board" class="board"></div>
    </section>

    <section class="guide">
      <h2>놀이 방법</h2>
      <ol>
        <li>줄의 맨 앞 빈칸에는 2 카드만 놓을 수 있습니다.</li>
        <li>그 외 빈칸에는 바로 왼쪽 카드와 같은 무늬이고 숫자가 하나 큰 카드만 놓을 수 있습니다.</li>
        <li>모든 줄을 2부터 K까지 완성하고 마지막 빈칸을 남기면 성공입니다.</li>
      </ol>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
