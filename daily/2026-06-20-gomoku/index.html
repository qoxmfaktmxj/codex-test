<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오목</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">오목</h1>
        <p class="intro">흑돌과 백돌을 번갈아 놓고 가로, 세로, 대각선으로 다섯 돌을 먼저 잇는 고전 바둑판 게임입니다.</p>
      </section>

      <section class="status-panel" aria-label="게임 상태">
        <div>
          <span class="label">차례</span>
          <strong id="turn">흑돌</strong>
        </div>
        <div>
          <span class="label">상태</span>
          <strong id="status">진행 중</strong>
        </div>
        <div>
          <span class="label">승자</span>
          <strong id="winner">-</strong>
        </div>
      </section>

      <section class="board-panel" aria-label="오목판">
        <div id="board" class="board"></div>
        <p id="message" class="message" role="status">흑돌 차례입니다.</p>
      </section>

      <section class="control-panel" aria-label="게임 조작">
        <button type="button" id="reset-button">다시 시작</button>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
