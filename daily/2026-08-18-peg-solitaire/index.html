<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페그 솔리테어</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 혼자 놀이</p>
      <h1>페그 솔리테어</h1>
      <p class="intro">말 하나를 다른 말 위로 뛰어넘어 없애고, 마지막 한 개만 남겨 보세요.</p>
    </header>
    <section class="control-panel" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite">움직일 말을 먼저 고르세요.</p>
      <p id="count" class="count">남은 말 32개</p>
      <button id="reset" type="button">새 게임</button>
    </section>
    <section id="board" class="board" aria-label="페그 솔리테어 말판"></section>
    <section class="guide">
      <h2>놀이 방법</h2>
      <ol>
        <li>말 하나를 선택한 뒤, 가로 또는 세로로 한 칸 건너 빈칸을 선택합니다.</li>
        <li>사이에 있던 말은 말판에서 사라집니다.</li>
        <li>더는 움직일 수 없을 때 남은 말이 하나면 성공입니다.</li>
      </ol>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
