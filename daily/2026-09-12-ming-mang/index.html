<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>밍망 · 데일리 클래식 게임</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">중국의 포위 전략</p>
      <h1>밍망</h1>
      <p class="guide">말을 가로·세로로 한 칸 움직이세요. 내 말 사이에 낀 상대 말은 내 색으로 바뀝니다. 상대 말을 모두 내 색으로 만들거나 움직이지 못하게 하면 이깁니다.</p>
    </header>
    <section class="game" aria-label="밍망 게임">
      <div class="status"><span id="turn-dot" aria-hidden="true"></span><strong id="message"></strong></div>
      <div id="board" class="board" role="group" aria-label="밍망 말판"></div>
      <div class="score"><span>붉은 말로 바꾼 수 <b id="red-count"></b></span><span>푸른 말로 바꾼 수 <b id="blue-count"></b></span></div>
      <button id="reset" type="button">새 게임</button>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
