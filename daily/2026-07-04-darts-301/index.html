<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>301 다트</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="hero" aria-labelledby="game-title">
      <p class="eyebrow">고전 펍 다트 게임</p>
      <h1 id="game-title">301 다트</h1>
      <p class="summary">한 라운드에 세 번 던져 301점을 정확히 0점으로 줄이세요. 마지막 점수는 반드시 더블 구역으로 끝내야 합니다.</p>
    </section>

    <section class="score-panel" aria-label="게임 상태">
      <div>
        <span class="label">남은 점수</span>
        <strong id="score">301</strong>
      </div>
      <div>
        <span class="label">라운드</span>
        <strong id="round">1</strong>
      </div>
      <div>
        <span class="label">남은 다트</span>
        <strong id="darts-left">3</strong>
      </div>
      <div>
        <span class="label">상태</span>
        <strong id="status">진행 중</strong>
      </div>
    </section>

    <section class="throw-panel" aria-label="던지기 선택">
      <div class="mode-row" role="group" aria-label="구역 배수">
        <button class="mode-button is-active" type="button" data-ring="single">싱글</button>
        <button class="mode-button" type="button" data-ring="double">더블</button>
        <button class="mode-button" type="button" data-ring="triple">트리플</button>
      </div>

      <div id="board" class="board" aria-label="다트 점수판"></div>

      <div class="special-row">
        <button class="special-button" type="button" data-ring="singleBull">싱글 불 25</button>
        <button class="special-button" type="button" data-ring="doubleBull">더블 불 50</button>
        <button class="special-button" type="button" data-ring="miss">빗나감 0</button>
      </div>
    </section>

    <section class="log-panel" aria-label="진행 기록">
      <p id="message" class="message">점수판에서 맞힌 구역을 고르세요.</p>
      <div class="current-turn">
        <span class="label">이번 라운드</span>
        <div id="turn-throws" class="throw-list">아직 던지지 않았습니다</div>
      </div>
      <div class="history-box">
        <span class="label">최근 기록</span>
        <ol id="history" class="history-list"></ol>
      </div>
      <button id="reset-button" class="reset-button" type="button">새 판</button>
    </section>
  </main>

  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
