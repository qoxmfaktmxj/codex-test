<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여우와 거위 · 바람길</title><link rel="stylesheet" href="styles.css"><script src="game-logic.js" defer></script><script src="app.js" defer></script></head><body><main><header><p>바람길의 고전판 · 2026. 09. 20</p><h1>여우와 거위</h1><p class="lead">거위는 길을 막고, 여우는 틈을 넘습니다.</p></header><section class="game" aria-label="여우와 거위 게임판"><div class="status"><b id="turn">거위 차례</b><span id="note">거위 하나를 골라 아래 또는 옆으로 움직이세요.</span><strong>여우가 잡은 거위 <i id="captured">0</i> / 4</strong></div><div id="board" class="board" role="grid" aria-label="게임판"></div><button id="reset" type="button">처음부터</button></section><footer>두 사람이 번갈아 둡니다. 거위는 가로 또는 아래로 한 칸, 여우는 어느 방향으로 한 칸 움직이거나 거위 하나를 넘어 잡습니다. 여우가 네 마리를 잡으면 여우 승리입니다.</footer></main></body></html>
