<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사이먼 기억력</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game" aria-labelledby="title">
      <h1 id="title">사이먼 기억력</h1>
      <p class="rule">표시된 순서를 외워 같은 색을 차례대로 누르세요.</p>
      <p class="sequence" data-sequence aria-label="현재 순서"></p>
      <p class="status" data-status aria-live="polite"></p>
      <button class="start" type="button" data-start>입력 시작</button>
      <div class="tiles" data-tiles aria-label="색 선택"></div>
      <button class="reset" type="button" data-reset>다시 시작</button>
    </main>
    <script src="./game-logic.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
