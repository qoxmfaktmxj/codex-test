<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구슬치기 · 분필 마당</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><p>1950 · 오후의 마당</p><h1>구슬치기</h1><span>분필 고리 안으로 튕겨, 열두 칸을 먼저 채우세요.</span></header>
<section class="yard" aria-label="구슬치기 게임판"><div class="score left"><b id="player-score">0</b><small>나의 칸</small></div><div class="rings"><i></i><i></i><i></i><strong>12</strong><div id="burst" aria-live="polite"></div><button class="marble cyan" data-roll="3" aria-label="파란 구슬 튕기기"></button><button class="marble coral" data-roll="2" aria-label="산호색 구슬 튕기기"></button><button class="marble violet" data-roll="1" aria-label="보랏빛 구슬 튕기기"></button></div><div class="score right"><b id="computer-score">0</b><small>마당 친구</small></div></section>
<p id="message" class="message" aria-live="polite">구슬 하나를 골라 손가락으로 튕겨 보세요</p><div class="controls"><button id="restart">새 마당</button><p>파랑 3칸 · 산호 2칸 · 보라 1칸<br>구슬을 누르거나 1·2·3 키를 누르세요.</p></div></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
