<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브리지트</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 연결 전략 게임</p>
      <h1>브리지트</h1>
      <p class="intro">빨간 돌을 위아래로 이어 보세요. 컴퓨터의 파란 돌은 왼쪽과 오른쪽을 잇습니다.</p>
    </header>
    <section class="control-panel" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite">빨간 돌을 둘 차례입니다.</p>
      <p class="turn">내 돌 <span class="red-dot" aria-hidden="true"></span> · 컴퓨터 <span class="blue-dot" aria-hidden="true"></span></p>
      <button id="reset" type="button">새 게임</button>
    </section>
    <section id="board" class="board" aria-label="브리지트 말판"></section>
    <section class="guide">
      <h2>놀이 방법</h2>
      <ol>
        <li>빈 교차점을 눌러 빨간 돌을 놓습니다.</li>
        <li>빨간 돌이 가로·세로로 이어져 위쪽과 아래쪽에 닿으면 이깁니다.</li>
        <li>파란 돌이 먼저 왼쪽과 오른쪽을 이으면 컴퓨터가 이깁니다.</li>
      </ol>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
