<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시시마 · 데일리 클래식 게임</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">원 안에서 길을 읽는 케냐의 고전</p>
      <h1>시시마</h1>
      <p class="guide">내 말을 선으로 이어진 빈 점으로 한 칸씩 옮기세요. 내 말 세 개를 한 줄로 잇거나 상대가 움직일 수 없게 만들면 이깁니다. 같은 판이 세 번 나오면 무승부입니다.</p>
    </header>
    <section class="game" aria-label="시시마 게임">
      <div class="status"><span id="turn-dot" aria-hidden="true"></span><strong id="message"></strong></div>
      <div class="board-wrap">
        <svg class="lines" viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="126"/><path d="M24 150h252M150 24v252M61 61l178 178M239 61 61 239"/></svg>
        <div id="board" class="board" role="grid" aria-label="시시마 말판"></div>
      </div>
      <div class="legend"><span><i class="piece white"></i> 흰말</span><span><i class="piece black"></i> 검은말</span><span>빈 점으로 한 칸 이동</span></div>
      <button id="reset" type="button">새 게임</button>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
