<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>종이 축구 · 점수판</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="sheet">
    <aside class="mast"><p>1987 방과 후 리그</p><h1>종이<br><strong>축구</strong></h1><p class="rules">공을 대각선·직선으로 옮기세요.<br>지나간 선은 다시 밟을 수 없습니다.</p><button id="reset" type="button">새 경기</button></aside>
    <section class="pitch" aria-label="종이 축구 게임">
      <div class="scorebar"><span>이동 <b id="moves">0</b></span><span id="status" aria-live="polite">가운데에서 킥오프!</span><span>목표: 위·아래 골</span></div>
      <div id="board" class="board" role="grid" aria-label="종이 축구 경기장"></div>
      <p class="hint">조작: 점을 누르기 · 키보드: 탭 후 엔터</p>
    </section>
  </main>
  <script src="game-logic.js"></script><script src="app.js"></script>
</body></html>
