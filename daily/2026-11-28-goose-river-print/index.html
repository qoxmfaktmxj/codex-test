<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거위 게임 · 강물 인쇄소</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p>THE GAME OF GOOSE · 24 STOPS</p><h1>거위 게임 <span>강물 인쇄소</span></h1><p>주사위를 굴려 굽이치는 강길을 따라 24번 강 어귀에 먼저 닿으세요.</p></header><section class="river-print" aria-label="거위 게임 강길"><div class="river" aria-hidden="true"></div><div id="board" class="board" role="list" aria-label="24칸 강길 게임판"></div></section><footer><strong id="message" aria-live="polite"></strong><div class="controls"><button id="roll" type="button">주사위 굴리기</button><button id="reset" type="button">새 항해</button><output id="dice" aria-live="polite">—</output></div><p class="key">Enter 또는 Space로 주사위를 굴릴 수 있습니다.</p></footer></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
