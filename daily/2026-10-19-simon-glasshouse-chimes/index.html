<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차임 기억놀이 · 유리 온실</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><p class="eyebrow">유리 온실 · 기억의 차임</p><h1>차임 기억놀이</h1><p class="lead">빛나는 유리 조각의 순서를 듣고 따라 누르세요.</p></header>
<section class="game" aria-label="차임 기억놀이 게임"><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div><div class="dial" id="dial"><button class="tone teal" data-tone="0" aria-label="첫 번째 차임"></button><button class="tone coral" data-tone="1" aria-label="두 번째 차임"></button><button class="tone plum" data-tone="2" aria-label="세 번째 차임"></button><button class="tone lime" data-tone="3" aria-label="네 번째 차임"></button><div class="hub"><span id="round">1</span><small>번째 차임</small></div></div></section>
<section class="readout" aria-live="polite"><p id="message">시작을 누르면 차임이 울립니다.</p><p class="keys">키보드 <b>1</b> <b>2</b> <b>3</b> <b>4</b> 로도 연주할 수 있어요</p><button id="start">온실 차임 시작</button><span id="best">최고 0번째</span></section></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
