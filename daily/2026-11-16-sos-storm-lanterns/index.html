<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOS · 폭풍 등대국</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="mast">기상 전보 16 · 연안 신호</p><h1>SOS <em>폭풍 등대국</em></h1><p class="lede">S와 O로 신호를 완성하세요. SOS를 만들면 한 번 더 보냅니다.</p></header><section class="signal" aria-label="SOS 게임판"><div class="weather"><span id="turn-label">등대 차례</span><span class="dash">··· ··· ···</span><span id="score">등대 0 : 0 배</span></div><div id="board" class="board" aria-live="polite"></div><p id="status" class="status">불러오는 중</p></section><section class="letters" aria-label="놓을 문자"><button type="button" class="letter active" data-letter="S" aria-pressed="true">S</button><button type="button" class="letter" data-letter="O" aria-pressed="false">O</button><button type="button" id="reset" class="reset">새 전보</button></section><p class="hint">문자를 고른 뒤 빈 칸을 누르세요. <kbd>Tab</kbd>과 <kbd>Enter</kbd>도 사용할 수 있습니다.</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
