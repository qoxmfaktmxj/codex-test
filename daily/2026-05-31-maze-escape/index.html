<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미로 탈출</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="hero" aria-labelledby="game-title">
      <p class="eyebrow">데일리 클래식 게임</p>
      <h1 id="game-title">미로 탈출</h1>
      <p>작은 미로에서 열쇠를 찾은 뒤 출구 문으로 탈출하세요.</p>
    </section>

    <section class="panel" aria-label="미로 게임판">
      <div class="score-row">
        <span id="status">열쇠 없음 · 이동 0번</span>
        <button id="reset-button" type="button">다시 시작</button>
      </div>
      <div id="maze" class="maze" role="grid" aria-label="미로"></div>
      <p id="message" class="message" aria-live="polite">열쇠를 찾아 출구로 탈출하세요.</p>
      <div class="controls" aria-label="이동 버튼">
        <button type="button" data-direction="up">위</button>
        <button type="button" data-direction="left">왼쪽</button>
        <button type="button" data-direction="down">아래</button>
        <button type="button" data-direction="right">오른쪽</button>
      </div>
      <p class="hint">키보드 방향키로도 움직일 수 있습니다.</p>
    </section>
  </main>

  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
