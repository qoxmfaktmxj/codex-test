<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키노 · 역광 벽보국</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p>역광 벽보국 · 매일 한 장</p><h1>키노<br><span>밤의 번호표</span></h1><p class="rule">1부터 25까지, 다섯 칸을 찍고 추첨을 여세요.</p></header><section class="poster" aria-label="키노 게임"><div class="side">PICK 05<br>LUCKY DRAW</div><div id="board" aria-label="번호 선택판"></div><div class="controls"><p id="message" aria-live="polite">번호를 고르세요</p><strong id="count">선택 0 / 5</strong><button id="draw">추첨 열기</button><button id="reset">새 벽보</button></div></section><p class="hint">칸을 누르세요 · Enter로 추첨 · 선택은 다섯 칸까지</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
