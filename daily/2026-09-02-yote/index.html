<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>요테</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 전략 게임</p>
      <h1>요테</h1>
      <p class="intro">상대 말을 뛰어넘어 잡고 하나를 더 치우는 서아프리카 전략 게임입니다.</p>
    </header>
    <section class="status-card" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite"></p>
      <button id="reset" type="button">새로 시작</button>
    </section>
    <section class="board-card" aria-label="요테 말판">
      <div id="board" class="board"></div>
      <div class="legend"><span><i class="piece blue"></i>파랑</span><span><i class="piece orange"></i>주황</span></div>
    </section>
    <section class="guide"><h2>놀이 방법</h2><ol><li>파랑부터 빈 칸에 말 열두 개를 번갈아 놓습니다.</li><li>말을 모두 놓으면 내 말을 가로 또는 세로 이웃 빈 칸으로 한 칸 움직입니다.</li><li>상대 말을 하나 넘어 빈 칸으로 뛰면 그 말을 잡고, 상대 말 하나를 더 골라 치웁니다.</li><li>상대 말을 모두 없애거나 상대가 움직이지 못하게 하면 이깁니다.</li></ol></section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
