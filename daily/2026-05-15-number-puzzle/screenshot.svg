<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">숫자 퍼즐 게임 화면</title>
  <desc id="desc">3x3 숫자 퍼즐 판과 이동 횟수, 다시 시작 버튼이 보이는 화면</desc>
  <rect width="720" height="520" fill="#f5f2ea"/>
  <text x="360" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#151515">숫자 퍼즐</text>
  <text x="360" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#151515">이동 횟수 0</text>
  <g transform="translate(210 145)">
    <rect x="0" y="0" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <rect x="105" y="0" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <rect x="210" y="0" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <rect x="0" y="105" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <rect x="105" y="105" width="90" height="90" fill="#151515" stroke="#151515" stroke-width="4"/>
    <rect x="210" y="105" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <rect x="0" y="210" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <rect x="105" y="210" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <rect x="210" y="210" width="90" height="90" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <g font-family="Arial, sans-serif" font-size="44" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#151515">
      <text x="45" y="48">1</text>
      <text x="150" y="48">2</text>
      <text x="255" y="48">3</text>
      <text x="45" y="153">4</text>
      <text x="255" y="153">6</text>
      <text x="45" y="258">7</text>
      <text x="150" y="258">5</text>
      <text x="255" y="258">8</text>
    </g>
  </g>
  <rect x="291" y="470" width="138" height="38" fill="#151515"/>
  <text x="360" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">다시 시작</text>
</svg>
