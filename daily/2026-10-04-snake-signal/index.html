<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스네이크 신호국</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">S-04 / 실시간 관제</p><h1>스네이크<br><span>신호국</span></h1><p class="intro">신호를 따라 선로를 연장하세요. 경계선과 자신의 꼬리를 피해야 합니다.</p></header><section class="console" aria-label="스네이크 게임"><div class="screen"><div class="scan"></div><div id="board" class="board" role="grid" aria-label="게임판"></div><p id="notice" class="notice" aria-live="polite"></p></div><aside><dl><div><dt>점수</dt><dd id="score">00</dd></div><div><dt>최고 기록</dt><dd id="best">00</dd></div><div><dt>상태</dt><dd id="status">운행 중</dd></div></dl><button id="restart" type="button">새 운행 시작</button><p class="keys">방향키 또는 화면의 화살표로 조종</p></aside></section><nav class="pad" aria-label="방향 조종"><button data-dir="up" aria-label="위로">↑</button><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="down" aria-label="아래로">↓</button><button data-dir="right" aria-label="오른쪽">→</button></nav></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
