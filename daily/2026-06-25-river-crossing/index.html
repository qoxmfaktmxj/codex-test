<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>강 건너기</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">강 건너기</h1>
        <p class="summary">농부가 작은 배로 늑대, 염소, 양배추를 모두 안전하게 오른쪽 강가로 옮기는 고전 퍼즐입니다.</p>
      </section>

      <section class="panel" aria-label="게임판">
        <div class="status-row">
          <div>
            <span class="label">이동</span>
            <strong id="move-count">0회</strong>
          </div>
          <div>
            <span class="label">상태</span>
            <strong id="game-status">진행 중</strong>
          </div>
          <button id="restart-button" type="button">다시 시작</button>
        </div>

        <p id="message" class="message" aria-live="polite">농부와 짐을 모두 오른쪽 강가로 옮기세요.</p>

        <div class="river-scene">
          <div class="bank" aria-label="왼쪽 강가">
            <h2>왼쪽 강가</h2>
            <div id="left-bank" class="item-list"></div>
          </div>

          <div class="river" aria-hidden="true">
            <div id="boat" class="boat">배</div>
          </div>

          <div class="bank" aria-label="오른쪽 강가">
            <h2>오른쪽 강가</h2>
            <div id="right-bank" class="item-list"></div>
          </div>
        </div>

        <div class="controls" aria-label="이동 선택">
          <button type="button" data-passenger="">농부만 이동</button>
          <button type="button" data-passenger="wolf">늑대 태우기</button>
          <button type="button" data-passenger="goat">염소 태우기</button>
          <button type="button" data-passenger="cabbage">양배추 태우기</button>
        </div>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
