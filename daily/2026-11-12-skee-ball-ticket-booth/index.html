<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스키볼 · 티켓 부스</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><p class="eyebrow">1930 · 동전 오락실</p><h1>스키볼 <span>티켓 부스</span></h1><p class="intro">레인의 점수 구멍을 눌러 아홉 공을 굴리세요. 높은 고리에 넣을수록 티켓이 많아집니다.</p></header>
<section class="scorebar" aria-label="게임 현황"><div><b id="score">0</b><small>티켓</small></div><div><b id="balls">9</b><small>남은 공</small></div><button id="reset">새 게임</button></section>
<section class="lane-wrap" aria-label="스키볼 레인"><div class="marquee">ROLL · WIN · REDEEM</div><div class="lane"><div class="ball" id="ball" aria-hidden="true"></div><div class="ramp"></div><div class="target" id="target"><button data-points="100" class="p100" aria-label="보너스 100점 포켓">100</button><button data-points="50" class="p50" aria-label="중앙 50점 포켓">50</button><button data-points="30" class="p30 a" aria-label="중간 30점 포켓">30</button><button data-points="30" class="p30 b" aria-label="중간 30점 포켓">30</button><button data-points="20" class="p20 a" aria-label="안쪽 20점 포켓">20</button><button data-points="20" class="p20 b" aria-label="안쪽 20점 포켓">20</button><button data-points="10" class="p10 a" aria-label="바깥 10점 포켓">10</button><button data-points="10" class="p10 b" aria-label="바깥 10점 포켓">10</button></div></div></section>
<p id="message" class="message" role="status">공을 굴려 티켓을 모으세요</p><p class="hint">점수 구멍을 누르거나 탭하세요</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
