<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>피카리아</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 전략 게임</p>
      <h1>피카리아</h1>
      <p class="intro">세 말을 놓고 선을 따라 움직여 한 줄을 먼저 만드세요.</p>
    </header>
    <section class="status-card" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite"></p>
      <button id="reset" type="button">새로 시작</button>
    </section>
    <section class="board-card" aria-label="피카리아 말판">
      <div id="board" class="board"></div>
      <div class="legend"><span><i class="piece blue"></i>파랑</span><span><i class="piece orange"></i>주황</span></div>
    </section>
    <section class="guide"><h2>놀이 방법</h2><ol><li>파랑부터 빈 점에 말 세 개를 번갈아 놓습니다.</li><li>말을 모두 놓은 뒤에는 내 말을 눌러 선으로 이어진 빈 점으로 한 칸 움직입니다.</li><li>가로·세로·대각선으로 말 세 개를 한 줄로 먼저 이으면 이깁니다.</li></ol></section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
