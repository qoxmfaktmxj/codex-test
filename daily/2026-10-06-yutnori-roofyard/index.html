<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>윷놀이 · 기와마당</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p>가을 마당 · 스무 칸의 길</p><h1>윷놀이 <span>기와마당</span></h1><p class="intro">윷을 던져 말이 기와 길 스무 칸을 한 바퀴 돌아오게 하세요.</p></header><section class="play" aria-label="윷놀이 게임"><div class="board-wrap"><div class="sun" aria-hidden="true"></div><div id="board" class="board" aria-label="스무 칸 윷놀이 길"></div><div class="center" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M50 8C60 28 72 34 92 36C72 45 65 57 64 91C55 67 43 62 8 64C31 54 36 42 35 8C41 20 45 24 50 8Z"/></svg><b>마당</b></div></div><div class="ledger"><p><span>던진 횟수</span><strong id="turns">0</strong></p><p><span>말의 자리</span><strong id="place">출발</strong></p><p><span>오늘의 결과</span><strong id="result">—</strong></p></div></section><section class="throw"><div id="sticks" class="sticks" aria-live="polite"><i></i><i></i><i></i><i></i></div><button id="roll" type="button">윷 던지기</button><button id="reset" type="button">새 판</button><p id="notice" class="notice" aria-live="polite">버튼을 누르거나 빈 화면에서 스페이스바로 시작하세요.</p></section></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
