<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여우와 사냥개</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="intro" aria-labelledby="title">
      <p class="date">2026년 7월 13일</p>
      <h1 id="title">여우와 사냥개</h1>
      <p>여우를 대각선으로 움직여 사냥개 줄을 빠져나가세요. 사냥개는 아래쪽으로만 압박합니다.</p>
    </section>

    <section class="panel" aria-label="여우와 사냥개 게임판">
      <div class="status-row">
        <div>
          <span class="label">차례</span>
          <strong id="turn">여우</strong>
        </div>
        <div>
          <span class="label">목표</span>
          <strong id="goal">맨 위 줄 도착</strong>
        </div>
        <div>
          <span class="label">상태</span>
          <strong id="status">진행 중</strong>
        </div>
      </div>

      <div id="board" class="board" aria-label="여덟 칸 체커 말판"></div>

      <p id="message" class="message" aria-live="polite">여우를 대각선 한 칸으로 움직이세요.</p>

      <div class="actions">
        <button id="reset" type="button">새 판</button>
      </div>
    </section>
  </main>

  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
