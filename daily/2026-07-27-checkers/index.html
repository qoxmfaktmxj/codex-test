<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니 체커</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">DAILY CLASSIC</p>
      <h1>미니 체커</h1>
      <p>대각선으로 말을 움직여 상대 말을 모두 잡으세요.</p>
    </header>
    <section class="score" aria-label="남은 말 수">
      <span>흑돌 <strong data-black-count>6</strong></span>
      <span>백돌 <strong data-white-count>6</strong></span>
    </section>
    <div class="board" data-board aria-label="체커 말판"></div>
    <p class="message" data-message aria-live="polite"></p>
    <button type="button" class="reset" data-reset>새 게임</button>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
