<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>블랙잭 21</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">블랙잭 21</h1>
        <p class="intro">카드를 받아 21에 가깝게 만들고 딜러보다 높은 점수로 승리하세요.</p>
      </section>

      <section class="score-panel" aria-label="점수판">
        <div>
          <span>플레이어</span>
          <strong id="player-score">0</strong>
        </div>
        <div>
          <span>딜러</span>
          <strong id="dealer-score">?</strong>
        </div>
        <div>
          <span>남은 카드</span>
          <strong id="deck-count">0</strong>
        </div>
      </section>

      <section class="table" aria-label="블랙잭 테이블">
        <div class="hand-zone">
          <h2>딜러 패</h2>
          <div id="dealer-hand" class="hand"></div>
        </div>
        <div class="hand-zone">
          <h2>플레이어 패</h2>
          <div id="player-hand" class="hand"></div>
        </div>
      </section>

      <p id="message" class="message" role="status">카드를 더 받을지 멈출지 선택하세요.</p>

      <section class="controls" aria-label="조작">
        <button id="hit-button" type="button">카드 받기</button>
        <button id="stand-button" type="button">멈추기</button>
        <button id="reset-button" type="button">새 게임</button>
      </section>

      <p class="help">에이스는 상황에 따라 11점 또는 1점으로 계산됩니다.</p>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
