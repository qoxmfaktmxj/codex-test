<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파치시 · 강변 두루마리</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><p class="eyebrow">인도 고전 경주 놀이</p><h1>파치시 <span>강변 두루마리</span></h1><p class="rule">갈대 말과 먹물 말을 <b>10칸</b> 끝까지 먼저 흘려보내세요. 막대 넷은 한 번 더 움직입니다.</p></header>
<section class="game" aria-label="파치시 게임"><div class="river" aria-hidden="true"></div><div class="status"><strong id="turn">갈대 말 차례</strong><span id="message">막대를 던져 흐름을 정하세요.</span></div><div class="track" id="track" aria-label="열 칸 경주판"></div><div class="pawns"><div><i class="reed"></i><b id="reed-score">0</b><small>갈대 말</small></div><div><i class="ink"></i><b id="ink-score">0</b><small>먹물 말</small></div></div><div class="actions"><button id="roll">막대 던지기</button><button id="move" disabled>말 흐르게 하기</button><button id="reset" class="quiet">처음부터</button></div></section>
<p class="keys">마우스 또는 <kbd>Enter</kbd>로 막대를 던지고, <kbd>Space</kbd>로 말을 움직입니다.</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
