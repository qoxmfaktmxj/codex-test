<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숫자 닫기 · 자개 부채판</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="kicker">여행 놀이판 제 09호</p><h1>숫자 닫기</h1><p>주사위 눈의 합만큼 자개 조각을 골라 부채를 접으세요.</p></header><section class="game" aria-label="숫자 닫기 게임"><div class="moon" aria-hidden="true"></div><div class="board-wrap"><div class="board" id="board" aria-label="자개 부채 숫자판"></div><div class="hub"><span>남은<br><b id="left">9</b></span></div></div><aside class="control"><p class="label">이번 눈</p><strong id="roll" class="roll" aria-live="polite">—</strong><p id="status" class="status" aria-live="polite">주사위를 굴려 첫 목표를 정하세요.</p><p class="sum">선택 합 <b id="sum">0</b></p><div class="actions"><button id="dice" type="button">주사위 굴리기</button><button id="close" type="button" disabled>조각 접기</button></div><button id="reset" class="reset" type="button">새 부채 펼치기</button></aside></section><p class="hint">숫자 조각을 눌러 고르고, 같은 합이 되면 접을 수 있습니다. 키보드 Tab·Enter도 사용할 수 있어요.</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
