<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니 하사미 장기 · 데일리 클래식 게임</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">가로세로로 끼워 잡는 일본의 고전</p>
      <h1>미니 하사미 장기</h1>
      <p class="guide">내 말을 가로 또는 세로로 빈칸까지 움직이세요. 상대 말을 내 말 사이에 끼우면 한 줄을 모두 잡습니다. 상대 말을 모두 잡거나 움직일 수 없게 만들면 승리합니다.</p>
    </header>
    <section class="game" aria-label="미니 하사미 장기 게임">
      <div class="status"><span id="turn-dot" aria-hidden="true"></span><strong id="message"></strong></div>
      <div id="board" class="board" role="grid" aria-label="미니 하사미 장기 말판"></div>
      <div class="legend"><span><i class="piece white"></i> 흰말</span><span><i class="piece black"></i> 검은말</span><span>흰말부터 시작</span></div>
      <button id="reset" type="button">새 게임</button>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
