<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타플</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 북유럽 전략 게임</p>
      <h1>타플</h1>
      <p class="intro">수비군은 왕을 모서리로 탈출시키고, 공격군은 왕을 사방에서 포위하세요.</p>
    </header>
    <section class="status-card" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite"></p>
      <button id="reset" type="button">새로 시작</button>
    </section>
    <section class="game-area" aria-label="타플 말판">
      <div class="legend"><span><i class="stone attacker"></i>공격군</span><span><i class="stone defender"></i>수비군</span><span><i class="stone king"></i>왕</span></div>
      <div id="board" class="board" aria-label="9×9칸 타플 말판"></div>
    </section>
    <section class="guide">
      <h2>놀이 방법</h2>
      <ol>
        <li>수비군부터 번갈아 말 하나를 고른 뒤, 가로 또는 세로 빈칸으로 원하는 만큼 움직입니다.</li>
        <li>상대 말을 내 말과 다른 내 말 또는 왕좌·모서리 사이에 끼우면 잡습니다.</li>
        <li>왕은 모서리에 도착하면 이기고, 공격군은 왕의 네 방향을 모두 둘러싸면 이깁니다.</li>
      </ol>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
