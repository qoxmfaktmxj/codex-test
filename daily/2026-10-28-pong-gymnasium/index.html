<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미니 탁구 · 오전 체육관</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p>학교 체육관 · 두 사람 경기</p><h1>미니 탁구</h1><span>먼저 5점을 얻으세요</span></header><section class="score" aria-label="점수판"><b id="left-score">0</b><i>:</i><b id="right-score">0</b></section><section id="court" class="court" aria-label="탁구 코트"></section><section class="controls" aria-label="게임 조작"><button id="left-up" type="button">왼쪽 위</button><button id="left-down" type="button">왼쪽 아래</button><p id="status" aria-live="polite">왼쪽: W/S · 오른쪽: ↑/↓</p><button id="right-up" type="button">오른쪽 위</button><button id="right-down" type="button">오른쪽 아래</button><button id="reset" type="button">새 경기</button></section></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
