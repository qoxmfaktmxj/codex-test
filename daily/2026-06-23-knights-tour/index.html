<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>기사 순회</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">기사 순회</h1>
        <p class="summary">체스 기사를 ㄱ자 모양으로 움직여 모든 칸을 한 번씩 방문하세요.</p>
      </section>

      <section class="panel" aria-label="게임판">
        <div class="status-row">
          <div>
            <span class="label">방문</span>
            <strong id="visited-count">1 / 25</strong>
          </div>
          <div>
            <span class="label">이동</span>
            <strong id="move-count">0</strong>
          </div>
          <button id="restart-button" type="button">다시 시작</button>
        </div>

        <p id="message" class="message" aria-live="polite">기사를 움직여 모든 칸을 한 번씩 방문하세요.</p>
        <div id="board" class="board" aria-label="기사 순회 판"></div>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
