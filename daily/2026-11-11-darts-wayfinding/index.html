<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다트 · 길찾기 표지판</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><p class="route">301 / 도시 순환로</p><h1>다트 <span>길찾기</span> 표지판</h1><p class="intro">원판을 눌러 남은 점수를 정확히 0으로 만드세요.</p></header>
<section class="stage" aria-label="다트 게임"><aside class="sign left"><b>남은 거리</b><strong id="remaining">301</strong><small>정확히 0</small></aside><div class="board-wrap"><button id="board" class="board" aria-label="다트판을 눌러 다트를 던지세요"><i class="ring outer"></i><i class="ring triple"></i><i class="ring inner"></i><i class="ring double"></i><i class="bull"></i><span id="dart" aria-hidden="true"></span><em id="boardLabel">조준</em></button><div class="numbers" aria-hidden="true"><b>20</b><b>5</b><b>12</b><b>9</b><b>14</b><b>11</b></div></div><aside class="sign right"><b>최근 점수</b><strong id="last">—</strong><small id="throws">0번째 던짐</small></aside></section>
<section class="controls"><p id="message" aria-live="polite">원판을 눌러 301점을 정확히 비우세요</p><div><button id="reset">새 표지판</button><span>키보드: 1~9, 0</span></div></section></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
