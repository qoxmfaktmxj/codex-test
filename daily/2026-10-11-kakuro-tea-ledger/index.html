<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카쿠로 · 찻집 장부</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><p class="eyebrow">TEA HOUSE / 11 OCT</p><h1>카쿠로 <span>찻집 장부</span></h1><p class="intro">가로·세로 합계에 맞게 1부터 9까지의 숫자를 겹치지 않게 채우세요.</p></header>
<section class="ledger" aria-label="카쿠로 게임판"><div class="ledger-top"><strong>오늘의 주문 합계</strong><span id="status" aria-live="polite">장부를 채우는 중</span></div><div id="board" class="board"></div><div class="ledger-bottom"><span>한 묶음 안에서 같은 숫자는 한 번만 씁니다.</span><button id="reset" type="button">장부 비우기</button></div></section>

<p class="hint">칸을 누른 뒤 숫자를 고르거나, 키보드 숫자와 백스페이스를 사용하세요.</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
