<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우르 왕실 경기 · 점토 경주</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">기원전 2600 · 남부 메소포타미아</p><h1>우르 왕실 경기 <span>점토 경주</span></h1><p id="message" aria-live="polite">남빛 말이 먼저 갑니다 · 막대 주사위를 던지세요</p></header><section class="arena" aria-label="우르 왕실 경기 게임판"><aside class="score indigo"><b>남빛 도착</b><strong id="indigo-score">0</strong><small>/ 7</small></aside><div id="board" class="board" aria-label="점토 경주길"></div><aside class="score terracotta"><b>토빛 도착</b><strong id="terracotta-score">0</strong><small>/ 7</small></aside></section><section class="throw"><div id="sticks" class="sticks" aria-label="막대 주사위 결과"><i></i><i></i><i></i><i></i></div><button id="roll" type="button">막대 주사위 던지기</button><p><b id="steps">0</b> 칸 · 로제트 칸에서는 한 번 더 던집니다</p></section><footer><p>말을 눌러 움직이세요. 탭과 스페이스 키로도 플레이할 수 있습니다.</p><button id="reset" type="button">새 점토판</button></footer></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
