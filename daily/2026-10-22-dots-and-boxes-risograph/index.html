<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점과 상자 · 리소그래프 작업대</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="kicker">두 색 잉크로 완성하는 고전 선 잇기</p><h1>점과 상자</h1><p class="subtitle">선을 하나씩 인쇄하세요. 상자를 닫으면 한 번 더 이어 갑니다.</p></header><section class="press" aria-label="점과 상자 게임"><aside class="score magenta"><b>자홍</b><strong id="magenta-score">0</strong></aside><div><div id="turn" class="turn" aria-live="polite">자홍 차례 · 선을 고르세요</div><div id="board" class="board" aria-label="게임판"></div></div><aside class="score teal"><b>청록</b><strong id="teal-score">0</strong></aside></section><footer><button id="reset">새 인쇄판</button><p>선을 클릭하거나, 선택한 선에서 Enter를 누르세요.</p></footer></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
