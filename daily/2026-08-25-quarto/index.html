<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니 콰르토</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 추상 전략 게임</p>
      <h1>미니 콰르토</h1>
      <p class="intro">상대가 고른 말을 놓고, 네 말의 공통 특징을 먼저 완성하세요.</p>
    </header>
    <section class="status-card" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite"></p>
      <button id="reset" type="button">새로 시작</button>
    </section>
    <section class="game-area" aria-label="콰르토 말판">
      <section class="board-wrap">
        <h2>말판</h2>
        <div id="board" class="board"></div>
      </section>
      <section class="pieces-wrap">
        <h2>상대에게 줄 말</h2>
        <p class="hint">키·색·모양·구멍 중 하나라도 네 말이 같으면 승리입니다.</p>
        <div id="pieces" class="pieces"></div>
      </section>
    </section>
    <section class="guide">
      <h2>놀이 방법</h2>
      <ol>
        <li>두 사람이 번갈아 합니다. 먼저 상대가 놓을 말을 고릅니다.</li>
        <li>상대는 그 말을 빈 칸에 놓은 뒤, 다음에 내가 놓을 말을 고릅니다.</li>
        <li>가로·세로·대각선에 키, 색, 모양, 구멍 중 같은 특징의 말 네 개를 만들면 이깁니다.</li>
      </ol>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
