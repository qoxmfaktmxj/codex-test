<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다섯밭 코노</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 전략 게임</p>
      <h1>다섯밭 코노</h1>
      <p class="intro">대각선으로 말을 옮겨 상대편 시작 자리를 먼저 모두 채우세요.</p>
    </header>
    <section class="status-card" aria-label="게임 상태와 조작">
      <p id="message" aria-live="polite"></p>
      <button id="reset" type="button">새로 시작</button>
    </section>
    <section class="game-area" aria-label="다섯밭 코노 말판">
      <div class="legend"><span><i class="stone blue"></i>푸른 말</span><span><i class="stone orange"></i>주황 말</span></div>
      <div id="board" class="board" aria-label="5×5칸 다섯밭 코노 말판"></div>
    </section>
    <section class="guide">
      <h2>놀이 방법</h2>
      <ol>
        <li>푸른 말부터 번갈아 말 하나를 선택합니다.</li>
        <li>비어 있는 대각선 한 칸으로만 움직일 수 있습니다. 말을 잡지는 않습니다.</li>
        <li>내 말 일곱 개가 상대편의 처음 자리 일곱 칸을 모두 채우면 승리합니다.</li>
      </ol>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
