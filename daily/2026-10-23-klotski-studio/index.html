<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>블록 탈출 · 형광 인쇄소</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><p class="kicker">BLOCK FORM 04 · 활판 시험지</p><h1>블록<br>탈출</h1><p class="intro">큰 빨간 판을 아래 <b>출구</b>로 빼내세요.<br>블록을 고른 뒤 방향 키 또는 버튼을 누릅니다.</p></header>
<section class="work" aria-label="블록 탈출 게임"><div class="ledger"><span id="move-count">00</span><small>이동</small><button id="reset" type="button">처음 배열</button></div><div class="board-wrap"><span class="ink-tag">PRESS / 23</span><div id="board" class="board" aria-label="4칸 5줄 블록 퍼즐" tabindex="0"></div><div class="exit">출구</div></div><div class="controls" aria-label="방향 조작"><button data-move="up" aria-label="위로">↑</button><button data-move="left" aria-label="왼쪽">←</button><button data-move="down" aria-label="아래로">↓</button><button data-move="right" aria-label="오른쪽">→</button></div><p id="status" role="status">블록을 골라 시작하세요.</p></section><footer>큰 판이 출구에 닿으면 인쇄 완료입니다.</footer></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
