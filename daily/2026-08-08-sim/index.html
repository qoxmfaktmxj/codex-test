<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>심</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">오늘의 고전 게임 · 삼각형 피하기</p>
      <h1>심</h1>
      <p>자기 색 선으로 삼각형을 먼저 완성하면 지는 전략 게임입니다.</p>
    </header>
    <section class="rule" aria-label="게임 규칙">
      <strong>당신은 주황색</strong><span>컴퓨터는 보라색</span><span>같은 색 삼각형을 만들면 패배</span>
    </section>
    <section class="score" aria-label="색 안내">
      <span><i class="player"></i> 당신의 선</span><span><i class="computer"></i> 컴퓨터의 선</span>
    </section>
    <section class="board" data-board aria-label="심 게임 말판"></section>
    <p class="message" data-message aria-live="polite"></p>
    <button type="button" class="new-game" data-reset>새 게임</button>
  </main>
  <script src="game-logic.js"></script><script src="app.js"></script>
</body>
</html>
