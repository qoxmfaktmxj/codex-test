<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>크랩스 주사위</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">크랩스 주사위</h1>
        <p class="summary">두 주사위를 굴려 첫 굴림의 행운을 노리거나, 정해진 포인트를 7보다 먼저 다시 만드는 고전 주사위 게임입니다.</p>
      </section>

      <section class="panel" aria-label="게임판">
        <div class="score-row">
          <div>
            <span class="label">상태</span>
            <strong id="status">진행 중</strong>
          </div>
          <div>
            <span class="label">포인트</span>
            <strong id="point">-</strong>
          </div>
        </div>

        <div class="dice-board" aria-label="주사위 결과">
          <div class="die" aria-label="1번 주사위 1">1</div>
          <div class="die" aria-label="2번 주사위 1">1</div>
        </div>

        <p id="message" class="message" aria-live="polite">첫 굴림에서 7이나 11이 나오면 승리합니다.</p>

        <div class="actions">
          <button id="roll-button" type="button">주사위 굴리기</button>
          <button id="reset-button" type="button">새 판</button>
        </div>

        <ol id="history" class="history" aria-label="굴림 기록"></ol>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
