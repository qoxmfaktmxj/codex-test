<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컵 속 공 찾기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="score-panel" aria-label="게임 상태">
      <div>
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1>컵 속 공 찾기</h1>
      </div>
      <button id="restart-button" type="button">새 판</button>
    </section>

    <section class="table" aria-label="컵 속 공 찾기 보드">
      <div id="status-message" class="status-message" aria-live="polite"></div>
      <div id="cups" class="cups"></div>
      <button id="shuffle-button" class="primary-action" type="button">섞기</button>
    </section>
  </main>

  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
