<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>님 게임</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="panel" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">님 게임</h1>
        <p class="intro">돌을 1개부터 3개까지 가져가세요. 마지막 돌을 가져가면 승리합니다.</p>

        <div class="status-bar" aria-live="polite">
          <span id="status">진행 중 · 남은 돌 21개</span>
          <span id="turn">당신 차례</span>
        </div>

        <div id="stones" class="stones" aria-label="남은 돌"></div>

        <div class="controls" aria-label="가져갈 돌 개수">
          <button type="button" data-take="1">1개</button>
          <button type="button" data-take="2">2개</button>
          <button type="button" data-take="3">3개</button>
        </div>

        <p id="message" class="message">돌 1개부터 3개까지 가져가세요. 마지막 돌을 가져가면 승리합니다.</p>

        <div class="history-wrap">
          <h2>진행 기록</h2>
          <ol id="history" class="history"></ol>
        </div>

        <button id="reset" class="reset" type="button">새 게임</button>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
