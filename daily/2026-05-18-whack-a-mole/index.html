<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>두더지 잡기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game" aria-labelledby="title">
      <section class="hero">
        <p class="eyebrow">오늘의 클래식 게임</p>
        <h1 id="title">두더지 잡기</h1>
        <p class="intro">튀어나온 두더지를 빠르게 눌러 점수를 올리세요. 다섯 번 놓치면 끝납니다.</p>
      </section>

      <section class="panel" aria-label="게임 정보">
        <div data-score>점수: 0</div>
        <div data-misses>실수: 0 / 5</div>
        <div data-round>라운드: 1</div>
      </section>

      <p class="status" data-message aria-live="polite">두더지를 잡아 보세요!</p>

      <section class="board" data-board aria-label="두더지 구멍"></section>

      <button class="reset" type="button" data-reset>새로 시작</button>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
