<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니 클론다이크 솔리테어</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">오늘의 고전 카드 퍼즐</p>
      <h1>미니 클론다이크</h1>
      <p class="intro">검은색과 빨간색을 번갈아 내림차순으로 쌓고, 같은 무늬의 카드를 A부터 기초 더미에 모으세요.</p>
    </header>

    <section class="control-panel" aria-label="게임 안내와 조작">
      <p id="message" aria-live="polite">카드를 눌러 고른 다음, 옮길 더미나 기초 더미를 누르세요.</p>
      <button id="reset" type="button">새로 시작</button>
    </section>

    <section class="table-card" aria-label="미니 클론다이크 말판">
      <div class="legend"><span>검은색·빨간색 교차</span><span>A부터 같은 무늬 순서</span></div>
      <div class="foundation-row" id="foundations" aria-label="기초 더미"></div>
      <div class="tableau" id="tableau" aria-label="카드 더미"></div>
    </section>

    <section class="guide">
      <h2>놀이 방법</h2>
      <ol>
        <li>아래 더미의 맨 위 열린 카드만 움직일 수 있습니다.</li>
        <li>카드는 색을 번갈아 한 단계 작은 숫자 위에 놓습니다.</li>
        <li>A부터 같은 무늬 순서로 기초 더미에 모두 모으면 성공입니다.</li>
      </ol>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
