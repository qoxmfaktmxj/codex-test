<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시계 솔리테어</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="intro" aria-labelledby="title">
      <p class="date">2026년 7월 17일</p>
      <h1 id="title">시계 솔리테어</h1>
      <p>왕 더미에서 시작해 열린 카드 숫자의 더미로 이동하며, 왕 네 장이 먼저 나오기 전에 모든 카드를 여세요.</p>
    </section>

    <section class="panel" aria-label="시계 솔리테어 카드판">
      <div class="status-row">
        <div>
          <span class="label">열린 카드</span>
          <strong id="revealed">0장</strong>
        </div>
        <div>
          <span class="label">현재 더미</span>
          <strong id="current">K</strong>
        </div>
        <div>
          <span class="label">상태</span>
          <strong id="status">진행 중</strong>
        </div>
      </div>

      <div id="board" class="clock-board" aria-label="시계 모양 카드 더미"></div>

      <p id="message" class="message" aria-live="polite">가운데 왕 더미에서 첫 카드를 뒤집으세요.</p>

      <div class="actions">
        <button id="turn" type="button">카드 뒤집기</button>
        <button id="reset" type="button">새 판</button>
      </div>
    </section>
  </main>

  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
