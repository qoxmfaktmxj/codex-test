<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>미니 스도쿠</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">미니 스도쿠</h1>
        <p class="intro">4x4 칸에 1부터 4까지의 숫자를 채워 행, 열, 작은 구역이 겹치지 않게 만드는 퍼즐입니다.</p>
      </section>

      <section class="score-panel" aria-label="게임 상태">
        <div>
          <span class="label">진행 상태</span>
          <strong id="status">진행 중</strong>
        </div>
        <div>
          <span class="label">입력 횟수</span>
          <strong id="moves">0</strong>
        </div>
        <div>
          <span class="label">오류</span>
          <strong id="errors">0</strong>
        </div>
      </section>

      <section class="board-panel" aria-label="스도쿠 보드">
        <div id="board" class="board"></div>
        <p id="message" class="message" role="status">빈칸을 고르고 1부터 4까지 숫자를 넣으세요.</p>
      </section>

      <section class="number-panel" aria-label="숫자 입력">
        <button type="button" data-number="1">1</button>
        <button type="button" data-number="2">2</button>
        <button type="button" data-number="3">3</button>
        <button type="button" data-number="4">4</button>
        <button type="button" id="clear-button">지우기</button>
        <button type="button" id="reset-button">다시 시작</button>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
