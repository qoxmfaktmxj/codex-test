<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>개구리 건너기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">개구리 건너기</h1>
        <p class="intro">자동차가 오가는 길을 건너 개구리를 위쪽 연못까지 데려가세요.</p>
      </section>

      <section class="status-panel" aria-label="게임 상태">
        <div>
          <span class="label">상태</span>
          <strong id="status">진행 중</strong>
        </div>
        <div>
          <span class="label">점수</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">차례</span>
          <strong id="tick">0</strong>
        </div>
      </section>

      <p id="message" class="message" role="status">차를 피해 위쪽 연못까지 건너세요!</p>
      <div id="board" class="board" aria-label="개구리 건너기 판"></div>

      <section class="controls" aria-label="조작">
        <button type="button" data-move="up">위</button>
        <div class="control-row">
          <button type="button" data-move="left">왼쪽</button>
          <button type="button" data-move="down">아래</button>
          <button type="button" data-move="right">오른쪽</button>
        </div>
        <div class="control-row">
          <button type="button" id="wait-button">기다리기</button>
          <button type="button" id="reset-button">다시 시작</button>
        </div>
      </section>

      <p class="hint">키보드 방향키로 이동하고, 스페이스 키로 한 차례 기다릴 수 있습니다.</p>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
