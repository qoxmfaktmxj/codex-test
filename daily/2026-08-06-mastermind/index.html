<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마스터마인드</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">오늘의 고전 게임 · 암호 해독</p>
      <h1>마스터마인드</h1>
      <p>숨겨진 네 가지 색과 순서를 여덟 번 안에 찾아내세요.</p>
    </header>
    <section class="rule" aria-label="게임 규칙">
      <strong>힌트 읽기</strong><span><i class="exact"></i> 자리까지 맞음</span><span><i class="partial"></i> 색만 맞음</span>
    </section>
    <section class="answer" aria-label="정답 색"><b>정답</b><div data-answer class="pegs"></div></section>
    <section class="panel" aria-label="색 고르기">
      <p><strong>내 추측</strong><span data-count>0/4 선택</span></p>
      <div data-current class="pegs current"></div>
      <div data-palette class="palette"></div>
      <div class="actions"><button type="button" data-clear>다시 고르기</button><button type="button" data-submit>추측하기</button></div>
    </section>
    <p class="message" data-message aria-live="polite"></p>
    <section class="history" aria-label="추측 기록"><div class="history-title"><strong>추측 기록</strong><span data-remaining>남은 기회 8번</span></div><div data-history></div></section>
    <button type="button" class="new-game" data-reset>새 게임</button>
  </main>
  <script src="game-logic.js"></script><script src="app.js"></script>
</body>
</html>
