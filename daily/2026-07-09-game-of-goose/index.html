<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거위 게임</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="intro" aria-labelledby="game-title">
      <p class="eyebrow">고전 경주 보드게임</p>
      <h1 id="game-title">거위 게임</h1>
      <p class="summary">두 개의 주사위를 굴려 32번 칸에 정확히 도착하세요. 거위 칸은 더 달리고, 다리와 미로와 감옥은 승부를 흔듭니다.</p>
    </section>

    <section class="score-strip" aria-label="게임 상태">
      <div>
        <span class="label">내 위치</span>
        <strong id="human-position">0</strong>
      </div>
      <div>
        <span class="label">컴퓨터</span>
        <strong id="computer-position">0</strong>
      </div>
      <div>
        <span class="label">차례</span>
        <strong id="turn-label">나</strong>
      </div>
    </section>

    <section class="play-area" aria-label="거위 게임판">
      <div id="board" class="board" aria-label="말판"></div>
      <div class="dice-panel" aria-label="주사위">
        <span id="die-one" class="die">-</span>
        <span id="die-two" class="die">-</span>
      </div>
      <p id="message" class="message">주사위를 굴려 32번 칸에 정확히 도착하세요.</p>
      <div class="controls">
        <button id="roll-button" type="button">주사위 굴리기</button>
        <button id="reset-button" type="button">다시 시작</button>
      </div>
    </section>
  </main>

  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
