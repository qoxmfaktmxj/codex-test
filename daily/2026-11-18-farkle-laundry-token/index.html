<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천점 주사위 · 세탁표 교환소</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="serial">교환소 18호 · 1000점 완주</p><h1>천점 주사위 <span>세탁표 교환소</span></h1><p id="message" aria-live="polite">주사위를 굴려 교환권을 모으세요</p></header><section class="machine" aria-label="천점 주사위 게임판"><div class="meter"><b>보관 점수</b><strong id="total">0000</strong><small>/ 1000</small></div><div id="dice" class="dice" aria-label="주사위 선택 영역"></div><div class="controls"><button id="roll" type="button">주사위 굴리기</button><button id="keep" type="button" disabled>선택 보관</button><button id="bank" type="button" disabled>점수 보관</button></div><p class="receipt"><span>이번 교환권</span><strong id="turn-points">000</strong><span>점 · 1은 100점 · 5는 50점 · 같은 눈 3개는 큰 점수</span></p></section><footer><p>마우스/터치로 주사위를 고르고, 키보드 탭·스페이스로도 선택합니다.</p><button id="reset" type="button">새 교환 시작</button></footer></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
