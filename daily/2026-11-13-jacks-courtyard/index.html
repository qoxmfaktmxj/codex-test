<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공기놀이 · 겨울 마당</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="court-shell"><header><p class="eyebrow">WINTER COURT / CLASSIC PLAY</p><h1>공기놀이 <span>겨울 마당</span></h1><p class="intro">공기알을 하나씩 눌러 집고, 다섯 단을 완성하세요.</p></header>
<section class="score-rail" aria-label="게임 정보"><div><b id="round">1</b><span>현재 단</span></div><div><b id="left">5</b><span>남은 공기알</span></div><div><b id="score">0</b><span>점수</span></div></section>
<section class="play-area" aria-labelledby="board-title"><aside class="chalk-note"><span>손끝으로</span><strong>톡!</strong><span>공기알을 집어요</span></aside><div class="board"><div class="board-head"><h2 id="board-title">공기알 뜨기</h2><p id="message" aria-live="polite">공기알 하나를 골라 집으세요</p></div><div class="jacks" id="jacks" aria-label="공기알 선택"></div><button class="reset" id="reset" type="button">처음부터 다시</button></div><aside class="round-list" aria-label="단계 안내"><span>1단</span><span>2단</span><span>3단</span><span>4단</span><span>5단</span></aside></section>
<footer>공기알을 클릭하거나 Tab 뒤 Enter 또는 Space로 선택할 수 있습니다.</footer></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
