<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세네트 · 종이 극장</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="kicker">고대 이집트의 30칸 경주</p><h1>세네트 <i>종이 극장</i></h1><p class="instruction">막대를 던지고, 무대 위 배우를 눌러 정확히 퇴장시키세요.</p></header><section class="stage" aria-label="세네트 게임"><div class="lights" aria-hidden="true"></div><div class="curtain left"></div><div class="curtain right"></div><div class="board-wrap"><div class="board" id="board" aria-label="30칸 세네트 게임판"></div></div><div class="footlights" aria-hidden="true"></div></section><section class="control" aria-live="polite"><p id="message"></p><div class="actions"><button id="roll" type="button">막대 던지기</button><button id="reset" type="button">처음부터</button></div><p class="score" id="score"></p></section><aside><strong>놀이 방법</strong><span>말을 교환해 길을 비우고, 30번 칸에 정확히 닿으면 퇴장합니다. 26~29번 칸은 안전칸입니다.</span></aside></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
