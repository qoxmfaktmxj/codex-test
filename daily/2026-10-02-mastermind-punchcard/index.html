<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마스터마인드 · 천공 카드실</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">자료 처리실 · 카드 10호</p><h1>마스터마인드<br><em>천공 카드실</em></h1><p id="status" aria-live="polite">네 색을 골라 천공 카드를 제출하세요.</p></header><section class="card" aria-label="마스터마인드 천공 카드"><div class="card-top"><span>추측 기록</span><span>● 정확 · ○ 색만 맞음</span></div><div id="rows" class="rows" role="list" aria-label="추측 기록"></div><div class="answer" id="answer" aria-label="정답 카드"></div></section><section class="controls" aria-label="색 선택"><p>선택한 잉크 <span id="picked">0 / 4</span></p><div id="pending" class="pending" aria-label="현재 선택 순서"></div><div id="palette" class="palette"></div><div class="actions"><button id="undo" class="plain">마지막 취소</button><button id="clear" class="plain">모두 비우기</button><button id="submit" disabled>카드 제출</button><button id="reset" class="plain">새 암호</button></div></section><p class="hint">같은 색도 여러 번 고를 수 있습니다 · 숫자 1–6으로 색 선택</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
