<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>점과 상자</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">점과 상자</h1>
        <p class="intro">점 사이에 선을 번갈아 긋고 네 변이 닫힌 칸을 차지해 더 많은 상자를 모으는 고전 종이 게임입니다.</p>
      </section>

      <section class="score-panel" aria-label="게임 상태">
        <div>
          <span class="label">현재 차례</span>
          <strong id="turn">파랑</strong>
        </div>
        <div>
          <span class="label">파랑 점수</span>
          <strong id="blue-score">0</strong>
        </div>
        <div>
          <span class="label">빨강 점수</span>
          <strong id="red-score">0</strong>
        </div>
        <div>
          <span class="label">그은 선</span>
          <strong id="moves">0</strong>
        </div>
      </section>

      <section class="board-panel" aria-label="점과 상자 판">
        <div id="board" class="board-grid"></div>
        <p id="message" class="message" role="status">점 사이의 선을 골라 칸을 완성하세요.</p>
      </section>

      <section class="actions" aria-label="게임 조작">
        <button type="button" id="reset-button">다시 시작</button>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
