<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스네이크</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game" aria-labelledby="title">
      <h1 id="title">스네이크</h1>
      <p class="score" data-score aria-live="polite">점수: 0</p>
      <div class="board" data-board aria-label="스네이크 게임판"></div>
      <p class="status" data-status aria-live="polite">방향키로 시작하세요.</p>
      <button class="reset" type="button" data-reset>다시 시작</button>
    </main>
    <script src="./game-logic.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
