<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페그 솔리테어</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="panel" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">페그 솔리테어</h1>
        <p class="intro">말을 하나 건너 빈칸으로 뛰어넘어 제거하고, 마지막 말 하나만 남겨 보세요.</p>

        <div class="status-bar" aria-live="polite">
          <span id="summary">남은 말 32개 · 이동 0회</span>
          <span id="result">진행 중 · 가능한 이동 4개</span>
        </div>

        <div id="board" class="board" aria-label="페그 솔리테어 판"></div>

        <p id="message" class="message">말을 하나 건너 빈칸으로 뛰어넘으세요.</p>

        <div class="controls">
          <button id="reset" type="button">새 게임</button>
        </div>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
