<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달 착륙선 · 연 축제</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="kicker">바람을 읽는 착륙 훈련</p><h1>달 착륙선<br><em>연 축제</em></h1><p class="intro">연등이 뜬 밤, 느린 추력으로 달빛 활주로에 내려앉으세요.</p></header><section class="stage" aria-label="달 착륙 게임판"><canvas id="game" width="600" height="720" aria-label="달 착륙선 게임 화면"></canvas><div class="readout"><span>연료 <b id="fuel">80</b></span><span>수평 <b id="vx">0.00</b></span><span>하강 <b id="vy">0.00</b></span></div></section><section class="controls" aria-label="게임 조작"><button id="left" aria-label="왼쪽으로 이동">←</button><button id="thrust">추력</button><button id="right" aria-label="오른쪽으로 이동">→</button><button id="reset">다시 띄우기</button></section><p id="message" role="status">방향키 또는 버튼으로 조작하세요. 안전 하강 속도는 1.40 이하입니다.</p></main><script src="game-logic.js"></script><script src="app.js"></script></body></html>
