<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 퍼즐</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="hero">
      <p class="eyebrow">2026-05-25 데일리 클래식 게임</p>
      <h1>2048 퍼즐</h1>
      <p class="intro">같은 숫자 타일을 밀어 합치고 2048 타일을 만드는 한글 2048 퍼즐입니다.</p>
    </section>

    <section class="score-card" aria-live="polite">
      <div>
        <span>현재 점수</span>
        <strong id="score">0</strong>
      </div>
      <div>
        <span>최고 점수</span>
        <strong id="best">0</strong>
      </div>
      <div>
        <span>상태</span>
        <strong id="state">진행 중</strong>
      </div>
    </section>

    <p id="message" class="message">화살표 키나 버튼으로 숫자를 합쳐 2048을 만드세요.</p>

    <section id="board" class="board" aria-label="2048 게임판"></section>

    <section class="controls" aria-label="이동 버튼">
      <button type="button" data-direction="up">위</button>
      <button type="button" data-direction="left">왼쪽</button>
      <button type="button" data-direction="down">아래</button>
      <button type="button" data-direction="right">오른쪽</button>
    </section>

    <section class="footer-actions">
      <button type="button" id="reset-button">새 게임</button>
      <p class="help">한 번 이동할 때 같은 숫자는 한 번만 합쳐집니다. 빈칸이 없어도 합칠 수 있는 이웃이 있으면 계속 진행할 수 있습니다.</p>
    </section>
  </main>
  <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
