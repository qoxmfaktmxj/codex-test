<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>여덟 퀸</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">데일리 클래식 게임</p>
        <h1 id="game-title">여덟 퀸</h1>
        <p class="summary">체스 말판에 여덟 퀸을 놓되 서로 같은 가로, 세로, 대각선에 서지 않게 만드세요.</p>
      </section>

      <section class="panel" aria-label="게임판">
        <div class="status-row">
          <div>
            <span class="label">퀸</span>
            <strong id="queen-count">0 / 8</strong>
          </div>
          <div>
            <span class="label">상태</span>
            <strong id="game-status">진행 중</strong>
          </div>
          <button id="restart-button" type="button">다시 시작</button>
        </div>

        <p id="message" class="message" aria-live="polite">여덟 퀸을 서로 공격하지 않게 놓으세요.</p>
        <div id="board" class="board" aria-label="여덟 퀸 말판"></div>
      </section>
    </main>

    <script src="game-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
